name: Playwright API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous Allure results
        run: |
          rm -rf allure-results
          rm -rf allure-report

      - name: Run API tests
        run: npx playwright test tests/api/ --config=playwright.config.ts --trace=on --workers=1
        env:
          TMDB_API_KEY: ${{ secrets.API_KEY_PLAYWRIGHT }}
          TMDB_BASE_URL: https://api.themoviedb.org/3
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          ALLURE_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/allure-report/index.html

      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline --save-dev
          allure generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report