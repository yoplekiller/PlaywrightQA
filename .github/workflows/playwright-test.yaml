name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 하루 1회 (00:00 UTC)

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      - name: Install dependencies
        run: npm ci


      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Clean previous results
        run: |
          rm -rf playwright-report
          mkdir -p screenshots logs test-results
      
      # PR: 회귀 테스트를 Chromium + Edge 두 브라우저로 (예전 이름 "smoke"는 실제 동작과 달라서 정정)
      - name: Run regression tests on Chromium + Edge for pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:ui:all
        env:
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html

      # 예전엔 실행 후 test-results/*.zip 을 지워서 재시도 때 남는 trace 까지 삭제됐다 → 실패 원인 분석 불가. 이제 보존해서 업로드.
      - name: Run regression tests for main and scheduled runs
        if: github.event_name != 'pull_request'
        run: npm run test:ci
        env:
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html

      - name: Checkout AutoTC (release report module)
        if: always()
        uses: actions/checkout@v4
        with:
          repository: yoplekiller/AutoTC
          path: AutoTC

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install release report dependencies
        if: always()
        run: pip install groq requests python-dotenv

      - name: Run AI release report
        if: always()
        run: python AutoTC/src/release_report.py playwright-report/results.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html

      - name: Remove internal results.json before publishing report
        if: always()
        run: rm -f playwright-report/results.json

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-logs
          path: logs
          if-no-files-found: ignore
          retention-days: 7

      # 실패/flaky 테스트의 trace.zip(재시도 시 기록), 스크린샷, 분류표(summary.md)
      - name: Upload test results (traces, screenshots, summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy Playwright HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report
          publish_branch: gh-pages
          force_orphan: true

      # 통과/flaky/known issue/실패 분류표는 SummaryReporter 가 테스트 실행 중에 이미 요약에 써둔다
      - name: Create Test Summary
        if: always()
        run: |
          echo "## 실행 범위 · 리포트" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PR: regression (Chromium + Edge)" >> $GITHUB_STEP_SUMMARY
          echo "- main/schedule/manual: regression (Chromium, retries 1)" >> $GITHUB_STEP_SUMMARY
          echo "- 실패·flaky trace: Artifacts > ui-playwright-test-results (npx playwright show-trace)" >> $GITHUB_STEP_SUMMARY
          echo "- [View Playwright Report](https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html)" >> $GITHUB_STEP_SUMMARY
