name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # - name: Clean previous results
      #   run: |
      #     rm -rf allure-results*
      #     rm -rf allure-report
      #     rm -rf playwright-report
      #     mkdir -p screenshots videos logs test-results

     
      - name: Run UI Tests
        run: |
          npx playwright test tests/ui/ --config=playwright.config.ts --trace=on --workers=1 --reporter=allure-playwright
          mkdir -p allure-results-ui
          cp -r allure-results/* allure-results-ui/ || true
        env:
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html
          ALLURE_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/allure-report/index.html
        continue-on-error: true

