name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'


      - name: Install dependencies
        run: npm ci


      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf allure-results allure-report playwright-report allure-results-ui
          mkdir -p screenshots videos logs test-results
      
      - name: Set Test credentials
        run: |
          echo "KURLY_TEST_USER_EMAIL=${{ secrets.KURLY_TEST_USERNAME }}" >> $GITHUB_ENV
          echo "KURLY_TEST_USER_PASSWORD=${{ secrets.KURLY_TEST_PASSWORD }}" >> $GITHUB_ENV

      - name: Run UI Tests
        run: |
          npx playwright test tests/ui/ --config=playwright.config.ts --workers=2
          mkdir -p allure-results-ui
          cp -r allure-results/* allure-results-ui/ || true
          rm -rf allure-results
          rm -rf test-results/**/*.zip
          du -sh
        env:
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html
          ALLURE_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/allure-report/index.html
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results-ui --clean -o ./allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: allure-report
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-video
          path: videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-logs
          path: logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy Playwright HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report
          publish_branch: gh-pages
          keep_files: true


      - name: Deploy Allure HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report-ui
          publish_branch: gh-pages
          keep_files: true

      - name: Create Test Summary
        if: always()
        run: |
          echo "## 🎭 UI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "allure-report/widgets/summary.json" ]; then
            echo "📊 **Test Statistics:**" >> $GITHUB_STEP_SUMMARY
            cat allure-report/widgets/summary.json | jq -r '"- Total: \(.statistic.total // 0)\n- Passed: \(.statistic.passed // 0)\n- Failed: \(.statistic.failed // 0)\n- Skipped: \(.statistic.skipped // 0)"' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📈 [View Playwright Report](https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "📈 [View Allure Report](https://yoplekiller.github.io/PlaywrightQA/allure-report-ui/index.html)" >> $GITHUB_STEP_SUMMARY

  api-test:
    runs-on: ubuntu-latest
    needs : ui-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf allure-results allure-report playwright-report allure-results-api
          mkdir -p screenshots videos logs test-results

      - name: Run API Tests
        run: |
          npx playwright test tests/api/ --config=playwright.config.ts --workers=2
          mkdir -p allure-results-api
          cp -r allure-results/* allure-results-api/ || true
          rm -rf allure-results
          rm -rf test-results/**/*.zip
          du -sh
        env:
          TMDB_API_KEY: ${{ secrets.API_KEY_PLAYWRIGHT }}
          TMDB_BASE_URL: https://api.themoviedb.org/3
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html
          ALLURE_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/allure-report/index.html
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results-api --clean -o ./allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-video
          path: videos
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-logs
          path: logs
          if-no-files-found: ignore

      - name: Upload test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Deploy Allure HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report-api
          publish_branch: gh-pages
          keep_files: true


      - name: Create Test Summary
        if: always()
        run: |
          echo "## 🧪 API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "allure-report/widgets/summary.json" ]; then
            echo "📊 **Test Statistics:**" >> $GITHUB_STEP_SUMMARY
            cat allure-report/widgets/summary.json | jq -r '"- Total: \(.statistic.total // 0)\n- Passed: \(.statistic.passed // 0)\n- Failed: \(.statistic.failed // 0)\n- Skipped: \(.statistic.skipped // 0)"' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📈 [View Allure Report](https://yoplekiller.github.io/PlaywrightQA/allure-report-api/index.html)" >> $GITHUB_STEP_SUMMARY