name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous results
        run: |
          rm -rf allure-results allure-report playwright-report allure-results-ui
          mkdir -p screenshots videos logs test-results

      - name: Run UI Tests
        run: |
          npx playwright test tests/ui/ --config=playwright.config.ts --trace=on --workers=1
          mkdir -p allure-results-ui
          mkdir -p playwright-report
          cp -r allure-results/* allure-results-ui/ || true
          rm -rf allure-results
        env:
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html
          ALLURE_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/allure-report/index.html
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results-ui --clean -o ./allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: allure-report

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-video
          path: videos
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-logs
          path: logs
          if-no-files-found: ignore

      - name: Upload test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Deploy Playwright HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report
          publish_branch: gh-pages
          keep_files: true

      - name: Deploy Allure HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report-ui
          publish_branch: gh-pages
          keep_files: true

  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous results
        run: |
          rm -rf allure-results allure-report playwright-report allure-results-api
          mkdir -p screenshots videos logs test-results

      - name: Run API Tests
        run: |
          npx playwright test tests/api/ --config=playwright.config.ts --trace=on --workers=1
          mkdir -p allure-results-api
          cp -r allure-results/* allure-results-api/ || true
          rm -rf allure-results
        env:
          TMDB_API_KEY: ${{ secrets.API_KEY_PLAYWRIGHT }}
          TMDB_BASE_URL: https://api.themoviedb.org/3
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html
          ALLURE_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/allure-report/index.html
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results-api --clean -o ./allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-video
          path: videos
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-logs
          path: logs
          if-no-files-found: ignore

      - name: Upload test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Deploy Allure HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report-api
          publish_branch: gh-pages
          keep_files: true