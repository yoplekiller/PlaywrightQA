name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'


      - name: Install dependencies
        run: npm ci


      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf playwright-report
          mkdir -p screenshots videos logs test-results
      
      - name: Set Test credentials
        run: |
          echo "KURLY_TEST_USER_EMAIL=${{ secrets.KURLY_TEST_USERNAME }}" >> $GITHUB_ENV
          echo "KURLY_TEST_USER_PASSWORD=${{ secrets.KURLY_TEST_PASSWORD }}" >> $GITHUB_ENV

      - name: Run UI Tests
        run: |
          npx playwright test src/tests/ui/ --config=playwright.config.ts --workers=2
          rm -rf test-results/**/*.zip
          du -sh
        env:
          SLACK_WEBHOOK_TS: ${{ secrets.SLACK_WEBHOOK_TS }}
          PLAYWRIGHT_REPORT_URL: https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html
        continue-on-error: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-video
          path: videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-logs
          path: logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy Playwright HTML Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report
          publish_branch: gh-pages
          keep_files: true

      - name: Create Test Summary
        if: always()
        run: |
          echo "## 🎭 UI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📈 [View Playwright Report](https://yoplekiller.github.io/PlaywrightQA/playwright-report/index.html)" >> $GITHUB_STEP_SUMMARY

  