name: 🧪 API Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/api/**'

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 📦 Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: ▶️ Run API tests
        run: |
          rm -rf allure-results/api
          npx playwright test tests/api --project=API
        env:
          ALLURE_RESULTS_DIR: allure-results/api

      - name: 🧪 Generate Allure Report (API)
        if: always()
        run: |
          npx allure generate allure-results/api -o allure-report/api --clean

      - name: 📤 Upload API Allure Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report-api
          path: allure-report/api
